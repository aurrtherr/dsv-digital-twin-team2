# Render Blueprint for the Python backend (free plan; sleeps after ~15 min idle,
# first request after that takes ~1 min). Shared demo state resets on each deploy.
services:
  - type: web
    name: dsv-twin-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
